<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for 3D Faces -->
    <!-- Top Face (Indigo to Sky Blue) -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Left Face (Emerald to Teal) -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Right Face (Amber to Orange) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Center Highlights -->
    <linearGradient id="coreHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="210" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="170" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Mathematical Orbit Action Ring (G ↷ X) -->
  <g transform="rotate(-25 256 256)">
    <ellipse cx="256" cy="256" rx="220" ry="75" fill="none" stroke="url(#orbitGrad)" stroke-width="4.5" stroke-dasharray="14 10" />
    <!-- Orbiting particle/arrow -->
    <circle cx="476" cy="256" r="8" fill="#fbbf24" filter="url(#glow)" />
    <polygon points="480,250 495,256 480,262" fill="#fbbf24" />
  </g>

  <!-- Main Isometric Cube Body (Dark Base Matrix) -->
  <g id="cube-body">
    <!-- TOP FACE TILES (Isometric Y-projection) -->
    <!-- Row 0 (Back to Center) -->
    <polygon points="256,76 298,100 256,124 214,100" fill="url(#topGrad)" opacity="0.9" rx="3" />
    <polygon points="304,104 346,128 304,152 262,128" fill="url(#topGrad)" opacity="0.95" />
    <polygon points="352,132 394,156 352,180 310,156" fill="url(#topGrad)" />

    <!-- Row 1 (Mid) -->
    <polygon points="208,104 250,128 208,152 166,128" fill="url(#topGrad)" opacity="0.95" />
    <polygon points="256,132 298,156 256,180 214,156" fill="url(#coreHighlight)" filter="url(#glow)" />
    <polygon points="304,160 346,184 304,208 262,184" fill="url(#topGrad)" />

    <!-- Row 2 (Front) -->
    <polygon points="160,132 202,156 160,180 118,156" fill="url(#topGrad)" />
    <polygon points="208,160 250,184 208,208 166,184" fill="url(#topGrad)" />
    <polygon points="256,188 298,212 256,236 214,212" fill="#a5b4fc" />

    <!-- LEFT FACE TILES (Emerald/Teal) -->
    <!-- Column 0 (Back left) -->
    <polygon points="112,164 154,188 154,238 112,214" fill="url(#leftGrad)" opacity="0.85" />
    <polygon points="112,222 154,246 154,296 112,272" fill="url(#leftGrad)" opacity="0.85" />
    <polygon points="112,280 154,304 154,354 112,330" fill="url(#leftGrad)" opacity="0.8" />

    <!-- Column 1 (Mid left) -->
    <polygon points="160,192 202,216 202,266 160,242" fill="url(#leftGrad)" opacity="0.95" />
    <polygon points="160,250 202,274 202,324 160,300" fill="#10b981" />
    <polygon points="160,308 202,332 202,382 160,358" fill="url(#leftGrad)" opacity="0.9" />

    <!-- Column 2 (Front left edge) -->
    <polygon points="208,220 250,244 250,294 208,270" fill="url(#leftGrad)" />
    <polygon points="208,278 250,302 250,352 208,328" fill="url(#leftGrad)" />
    <polygon points="208,336 250,360 250,410 208,386" fill="url(#leftGrad)" />

    <!-- RIGHT FACE TILES (Amber/Orange) -->
    <!-- Column 0 (Front right edge) -->
    <polygon points="262,244 304,220 304,270 262,294" fill="url(#rightGrad)" />
    <polygon points="262,302 304,278 304,328 262,352" fill="url(#rightGrad)" />
    <polygon points="262,360 304,336 304,386 262,410" fill="url(#rightGrad)" />

    <!-- Column 1 (Mid right) -->
    <polygon points="310,216 352,192 352,242 310,266" fill="url(#rightGrad)" opacity="0.95" />
    <polygon points="310,274 352,250 352,300 310,324" fill="#f59e0b" />
    <polygon points="310,332 352,308 352,358 310,382" fill="url(#rightGrad)" opacity="0.9" />

    <!-- Column 2 (Back right) -->
    <polygon points="358,188 400,164 400,214 358,238" fill="url(#rightGrad)" opacity="0.85" />
    <polygon points="358,246 400,222 400,272 358,296" fill="url(#rightGrad)" opacity="0.85" />
    <polygon points="358,304 400,280 400,330 358,354" fill="url(#rightGrad)" opacity="0.8" />
  </g>

  <!-- Foreground Group Theory Math Emblem Overlay (G ↷ X) -->
  <g transform="translate(256, 436)" filter="url(#glow)">
    <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#090d16" stroke="#6366f1" stroke-width="2" />
    <text x="0" y="5" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">G ↷ X</text>
  </g>
</svg>
